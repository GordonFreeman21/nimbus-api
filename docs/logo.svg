<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="cloudShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cloud base -->
  <ellipse cx="20" cy="25" rx="14" ry="7" fill="url(#cloudGrad1)" filter="url(#cloudShadow)"/>
  
  <!-- Cloud puffs -->
  <ellipse cx="12" cy="21" rx="9" ry="7" fill="url(#cloudGrad2)" filter="url(#cloudShadow)"/>
  <ellipse cx="28" cy="21" rx="9" ry="7" fill="url(#cloudGrad2)" filter="url(#cloudShadow)"/>
  <ellipse cx="20" cy="17" rx="10" ry="8" fill="url(#cloudGrad2)" filter="url(#cloudShadow)"/>
  
  <!-- Top highlight -->
  <ellipse cx="18" cy="15" rx="5" ry="3" fill="rgba(255,255,255,0.5)"/>
  <ellipse cx="26" cy="18" rx="3" ry="2" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Lightning bolt -->
  <path d="M 22 24 L 18 32 L 21 32 L 19 38 L 26 30 L 23 30 L 25 24 Z" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
</svg>
