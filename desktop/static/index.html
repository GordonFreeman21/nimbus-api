<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nimbus</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            :root {
                --bg: #020617;
                --surface: #0f172a;
                --surface2: #1e293b;
                --border: #334155;
                --text: #f1f5f9;
                --muted: #94a3b8;
                --accent: #3b82f6;
                --accent-glow: rgba(59, 130, 246, 0.15);
                --success: #22c55e;
                --error: #ef4444;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .wrap {
                width: 100%;
                max-width: 640px;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 32px;
            }
            .brand svg {
                width: 32px;
                height: 32px;
                flex-shrink: 0;
            }
            .brand h1 {
                font-size: 1.25rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .tabs {
                display: flex;
                gap: 4px;
                background: var(--surface);
                border-radius: 12px;
                padding: 4px;
                margin-bottom: 16px;
            }
            .tab {
                flex: 1;
                padding: 10px;
                border: none;
                background: transparent;
                color: var(--muted);
                font-size: 0.82rem;
                font-weight: 600;
                cursor: pointer;
                border-radius: 9px;
                transition: all 0.2s;
            }
            .tab:hover {
                color: var(--text);
            }
            .tab.on {
                background: var(--accent);
                color: #fff;
                box-shadow: 0 2px 12px var(--accent-glow);
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 20px;
                margin-bottom: 12px;
            }
            .input-row {
                display: flex;
                gap: 10px;
            }
            .input {
                flex: 1;
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 12px 14px;
                color: var(--text);
                font-size: 0.88rem;
                font-family: inherit;
                outline: none;
                transition: border-color 0.2s;
            }
            .input::placeholder {
                color: var(--muted);
            }
            .input:focus {
                border-color: var(--accent);
            }
            .btn {
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: 10px;
                padding: 12px 20px;
                font-size: 0.82rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .btn:hover {
                box-shadow: 0 4px 16px var(--accent-glow);
                transform: translateY(-1px);
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }
            .result {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                overflow: hidden;
                min-height: 180px;
            }
            .result-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                font-size: 0.75rem;
                color: var(--muted);
            }
            .result-body {
                padding: 16px;
                font-size: 0.8rem;
                line-height: 1.7;
                color: var(--muted);
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 320px;
                overflow-y: auto;
                font-family: "SF Mono", Consolas, monospace;
            }
            .result-body img {
                max-width: 100%;
                border-radius: 8px;
            }
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 2px 8px;
                border-radius: 6px;
                font-size: 0.68rem;
                font-weight: 600;
            }
            .badge.ok {
                background: rgba(34, 197, 94, 0.1);
                color: var(--success);
            }
            .badge.err {
                background: rgba(239, 68, 68, 0.1);
                color: var(--error);
            }
            .copy {
                background: var(--surface2);
                border: 1px solid var(--border);
                color: var(--muted);
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 0.68rem;
                cursor: pointer;
                transition: all 0.2s;
            }
            .copy:hover {
                color: var(--text);
                border-color: var(--accent);
            }
            .hint {
                text-align: center;
                margin-top: 12px;
                font-size: 0.72rem;
                color: var(--muted);
            }
            .hint a {
                color: var(--accent);
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="brand">
                <svg viewBox="0 0 32 32" fill="none">
                    <defs>
                        <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
                            <stop offset="0%" stop-color="#60a5fa" />
                            <stop offset="100%" stop-color="#a78bfa" />
                        </linearGradient>
                    </defs>
                    <rect width="32" height="32" rx="8" fill="url(#g)" />
                    <path
                        d="M22 20H11a5.5 5.5 0 0 1-.8-10.95A7 7 0 0 1 22.5 13H23a4.5 4.5 0 0 1 0 9h-1z"
                        fill="#fff"
                        opacity=".95"
                    />
                </svg>
                <h1>Nimbus</h1>
            </div>

            <div class="tabs">
                <button class="tab on" onclick="pick('weather', this)">
                    ☁️ Weather
                </button>
                <button class="tab" onclick="pick('species', this)">
                    🧬 Species
                </button>
                <button class="tab" onclick="pick('screenshot', this)">
                    📸 Screenshot
                </button>
            </div>

            <div class="card">
                <div class="input-row">
                    <input
                        class="input"
                        id="q"
                        placeholder="City name…"
                        value="Berlin"
                    />
                    <button class="btn" id="go" onclick="fire()">Send</button>
                </div>
            </div>

            <div class="result">
                <div class="result-head">
                    <span id="stat">Ready</span>
                    <button
                        class="copy"
                        id="cp"
                        onclick="cp()"
                        style="display: none"
                    >
                        Copy
                    </button>
                </div>
                <div class="result-body" id="out">
                    Click <b>Send</b> or press <b>Enter</b> to test an endpoint.
                </div>
            </div>

            <div class="hint">
                Open source on
                <a
                    href="https://github.com/GordonFreeman21/nimbus-api"
                    target="_blank"
                    >GitHub</a
                >
            </div>
        </div>

        <script>
            const API = "https://nimbus-api-gxuc.onrender.com";
            let ep = "weather",
                last = "";
            const q = document.getElementById("q"),
                out = document.getElementById("out"),
                stat = document.getElementById("stat"),
                go = document.getElementById("go"),
                cp = document.getElementById("cp");

            function pick(e, b) {
                ep = e;
                document
                    .querySelectorAll(".tab")
                    .forEach((t) => t.classList.remove("on"));
                b.classList.add("on");
                q.placeholder =
                    e === "weather"
                        ? "City name…"
                        : e === "species"
                          ? "Species name…"
                          : "https://example.com";
                q.focus();
            }

            async function fire() {
                const v = q.value.trim();
                if (!v) return;
                // Auto-detect: if input looks like a URL, use screenshot endpoint
                const isUrl =
                    v.startsWith("http://") || v.startsWith("https://");
                const targetEp = isUrl ? "screenshot" : ep;
                const url =
                    targetEp === "screenshot"
                        ? `${API}/api/v1/screenshot?url=${encodeURIComponent(v)}`
                        : `${API}/api/v1/${targetEp}?${targetEp === "species" ? "name" : "city"}=${encodeURIComponent(v)}`;
                go.disabled = true;
                out.textContent = "Loading…";
                stat.textContent = "…";
                cp.style.display = "none";
                const t0 = Date.now();
                try {
                    const r = await fetch(url);
                    const ms = Date.now() - t0;
                    if (targetEp === "screenshot") {
                        if (r.ok) {
                            const b = await r.blob();
                            const i = URL.createObjectURL(b);
                            out.innerHTML = `<img src="${i}">`;
                            last = "Screenshot OK";
                        } else {
                            const t = await r.text();
                            out.textContent = t || "Error";
                            stat.className = "badge err";
                        }
                    } else {
                        const d = await r.json();
                        last = JSON.stringify(d, null, 2);
                        out.textContent = last;
                    }
                    stat.textContent = `${r.status} · ${ms}ms`;
                    stat.className = r.ok ? "badge ok" : "badge err";
                    cp.style.display = "";
                } catch (e) {
                    out.textContent = e.message;
                    stat.textContent = "Error";
                    stat.className = "badge err";
                } finally {
                    go.disabled = false;
                }
            }

            function cp() {
                navigator.clipboard.writeText(last);
                cp.textContent = "✓";
                setTimeout(() => (cp.textContent = "Copy"), 1200);
            }
            q.onkeypress = (e) => {
                if (e.key === "Enter") fire();
            };
        </script>
    </body>
</html>
