name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
            archive: nimbus-tester-windows.zip
          - os: macos-latest
            name: macos
            ext: ""
            archive: nimbus-tester-macos.tar.gz
          - os: ubuntu-latest
            name: linux
            ext: ""
            archive: nimbus-tester-linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential

      - name: Build
        run: |
          cd desktop
          go mod download
          go build -ldflags="-s -w" -o ../docs/download/nimbus-tester${{ matrix.ext }} .

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path docs/download/nimbus-tester.exe -DestinationPath docs/download/nimbus-tester-windows.zip

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd docs/download
          tar czf nimbus-tester-macos.tar.gz nimbus-tester

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd docs/download
          tar czf nimbus-tester-linux.tar.gz nimbus-tester

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: docs/download/${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Nimbus API Tester ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows  | `nimbus-tester-windows.zip` |
            | macOS    | `nimbus-tester-macos.tar.gz` |
            | Linux    | `nimbus-tester-linux.tar.gz` |

            Extract and run `nimbus-tester` (or `.exe` on Windows).
          files: |
            artifacts/nimbus-tester-windows.zip/nimbus-tester-windows.zip
            artifacts/nimbus-tester-macos.tar.gz/nimbus-tester-macos.tar.gz
            artifacts/nimbus-tester-linux.tar.gz/nimbus-tester-linux.tar.gz
          draft: false
          prerelease: false
